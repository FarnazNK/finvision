# FinVision — full stack: React frontend + FastAPI AI service.
#
#   docker compose up --build
#   frontend: http://localhost:8080
#   ai-service docs: http://localhost:8000/docs
#
# ANTHROPIC_API_KEY is optional; without it the AI service runs in a
# deterministic offline mode so the demo still works end-to-end.
services:
  ai-service:
    build: ./ai-service
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - FINVISION_MODEL=${FINVISION_MODEL:-claude-sonnet-5}
      - FINVISION_API_KEY=${FINVISION_API_KEY:-}
      - FINVISION_JWT_SECRET=${FINVISION_JWT_SECRET:-local-compose-change-me}
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://finvision:finvision@postgres:5432/finvision}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY:-}
      - FINVISION_RATE_LIMIT=${FINVISION_RATE_LIMIT:-30}
      - FINVISION_REQUEST_TIMEOUT=${FINVISION_REQUEST_TIMEOUT:-20}
    volumes:
      - finvision-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_AI_SERVICE_URL: ${VITE_AI_SERVICE_URL:-http://localhost:8000}
        VITE_AI_SERVICE_API_KEY: ${FINVISION_API_KEY:-}
    ports:
      - "8080:80"
    depends_on:
      - ai-service

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: finvision
      POSTGRES_USER: finvision
      POSTGRES_PASSWORD: finvision
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finvision -d finvision"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  # Workflow automation: import n8n/finvision-concentration-alert.json at
  # http://localhost:5678. Optional; nothing else depends on it.
  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-latest}
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=${TZ:-America/Edmonton}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_SECURE_COOKIE=false
      - FINVISION_API_URL=http://ai-service:8000
      - FINVISION_EMAIL=${FINVISION_EMAIL:-}
      - FINVISION_PASSWORD=${FINVISION_PASSWORD:-}
      - FINVISION_ALERT_THRESHOLD=${FINVISION_ALERT_THRESHOLD:-0.25}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n:/workflows:ro
    depends_on:
      - ai-service

volumes:
  finvision-data:
  postgres-data:
  n8n-data:
