name: AI evals (live model)

# Runs the eval set against the real Anthropic model. Manual only, so pushes
# never spend API credit. Needs the repository secret ANTHROPIC_API_KEY.
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model ID (blank = FINVISION_MODEL default in app/llm.py)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  live-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ai-service
    env:
      PYTHONPATH: ${{ github.workspace }}/ai-service
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      FINVISION_MODEL: ${{ inputs.model }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check the API key is configured
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Add the ANTHROPIC_API_KEY repository secret first."
            exit 1
          fi

      - name: Run evals against the model
        run: |
          set -o pipefail
          python -m evals.run --live | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-live
          path: |
            ai-service/evals/results-live.md
            ai-service/evals/results-live.json
