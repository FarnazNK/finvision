name: live-api-smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-api-smoke.yml"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/live-api-smoke.yml"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  verify-live-apis:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FINVISION_API_URL: https://finvision-api.vercel.app
      GROUNDED_API_URL: https://grounded-agent-api.vercel.app
      SECURESHOP_API_URL: https://secureshop-api.vercel.app
    steps:
      - name: Require deployed API origins
        run: |
          for name in FINVISION_API_URL GROUNDED_API_URL SECURESHOP_API_URL; do
            value="${!name}"
            if [[ ! "$value" =~ ^https://[^/]+/?$ ]]; then
              echo "::error::Set $name to its verified HTTPS API origin."
              exit 1
            fi
          done

      - name: FinVision dashboard
        run: |
          curl --fail --silent --show-error --location --max-time 60 https://farnaznk.github.io/finvision/ -o /tmp/finvision.html
          grep -qi "<html" /tmp/finvision.html

      - name: SecureShop storefront
        run: |
          curl --fail --silent --show-error --location --max-time 60 https://secureshop-storefront.vercel.app/ -o /tmp/secureshop.html
          grep -qi "<html" /tmp/secureshop.html

      - name: FinVision API
        run: |
          curl --fail --silent --show-error --max-time 60 "${FINVISION_API_URL%/}/docs"
          curl --fail --silent --show-error --max-time 60 ${FINVISION_API_URL%/}/health

      - name: RAG Agent API
        run: |
          curl --fail --silent --show-error --max-time 60 "${GROUNDED_API_URL%/}/docs"
          curl --fail --silent --show-error --max-time 60 ${GROUNDED_API_URL%/}/health/ready

      - name: SecureShop API
        run: |
          curl --fail --silent --show-error --max-time 60 "${SECURESHOP_API_URL%/}/api/reference"
          curl --fail --silent --show-error --max-time 60 ${SECURESHOP_API_URL%/}/api/v1/health
          curl --fail --silent --show-error --max-time 60 "${SECURESHOP_API_URL%/}/api/v1/products" -o /tmp/secureshop-products.json
          python -c 'import json; d=json.load(open("/tmp/secureshop-products.json")); assert isinstance(d["items"], list) and isinstance(d["meta"], dict), "Invalid products response"; assert d["items"], "Demo catalog is empty"'
