name: live-api-smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-api-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-apis:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: FinVision API
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 5 https://finvision-api.onrender.com/
          curl --fail --silent --show-error --retry 3 --retry-delay 5 https://finvision-api.onrender.com/health

      - name: RAG Agent API
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 5 https://rag-agent-api-2uau.onrender.com/
          curl --fail --silent --show-error --retry 3 --retry-delay 5 https://rag-agent-api-2uau.onrender.com/health/live

      - name: SecureShop API
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 5 https://secureshop-api-zckt.onrender.com/
          curl --fail --silent --show-error --retry 3 --retry-delay 5 https://secureshop-api-zckt.onrender.com/api/v1/health
          curl --fail --silent --show-error --retry 3 --retry-delay 5 https://secureshop-api-zckt.onrender.com/api/v1/products
