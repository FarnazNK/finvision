name: Publish Docker images

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # GHCR repository names must be lowercase; GitHub usernames may contain
  # uppercase characters.
  IMAGE_PREFIX: ghcr.io/farnaznk/finvision

jobs:
  publish:
    name: Build and publish images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE_PREFIX }}-web
            ${{ env.IMAGE_PREFIX }}-ai-service
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-web:latest
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_AI_SERVICE_URL=${{ vars.VITE_AI_SERVICE_URL }}

      - name: Build and push AI service image
        uses: docker/build-push-action@v6
        with:
          context: ./ai-service
          file: ./ai-service/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-ai-service:latest
          labels: ${{ steps.meta.outputs.labels }}
